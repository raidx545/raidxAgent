<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 800" width="1180" height="800" font-family="Segoe UI, Calibri, Helvetica, Arial, sans-serif">

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c2410c"/>
    </marker>
  </defs>

  <rect width="1180" height="800" fill="#ffffff"/>

  <!-- ============ device boundary ============ -->
  <rect x="150" y="70" width="560" height="690" rx="10"
        fill="#f8fafc" stroke="#1d4ed8" stroke-width="2"/>
  <rect x="150" y="70" width="560" height="34" rx="10" fill="#1d4ed8"/>
  <rect x="150" y="92" width="560" height="12" fill="#1d4ed8"/>
  <text x="430" y="93" text-anchor="middle" font-size="15" font-weight="600" fill="#ffffff">
    ON THIS DEVICE — raw page data never leaves
  </text>

  <!-- ============ trust boundary ============ -->
  <line x1="790" y1="60" x2="790" y2="770" stroke="#c2410c" stroke-width="2.5" stroke-dasharray="9 7"/>
  <text x="790" y="45" text-anchor="middle" font-size="15" font-weight="700" fill="#c2410c">
    TRUST BOUNDARY
  </text>
  <text x="790" y="786" text-anchor="middle" font-size="12.5" fill="#c2410c">
    only tokens, structure and redacted pixels cross
  </text>

  <!-- ============ actor: user ============ -->
  <g stroke="#334155" stroke-width="2" fill="none">
    <circle cx="70" cy="205" r="15" fill="#ffffff"/>
    <line x1="70" y1="220" x2="70" y2="262"/>
    <line x1="46" y1="234" x2="94" y2="234"/>
    <line x1="70" y1="262" x2="50" y2="292"/>
    <line x1="70" y1="262" x2="90" y2="292"/>
  </g>
  <text x="70" y="315" text-anchor="middle" font-size="14.5" font-weight="600" fill="#1f2937">User</text>
  <text x="70" y="333" text-anchor="middle" font-size="11.5" fill="#64748b">data principal</text>

  <!-- ============ actor: web page ============ -->
  <g stroke="#334155" stroke-width="2" fill="none">
    <rect x="36" y="565" width="68" height="52" rx="4" fill="#ffffff"/>
    <line x1="36" y1="581" x2="104" y2="581"/>
    <circle cx="48" cy="573" r="3" fill="#334155"/>
    <circle cx="58" cy="573" r="3" fill="#334155"/>
  </g>
  <text x="70" y="638" text-anchor="middle" font-size="14.5" font-weight="600" fill="#1f2937">Web page</text>
  <text x="70" y="656" text-anchor="middle" font-size="11.5" fill="#64748b">untrusted</text>
  <text x="70" y="672" text-anchor="middle" font-size="11.5" fill="#64748b">content</text>

  <!-- ============ actor: LLM provider ============ -->
  <g stroke="#c2410c" stroke-width="2" fill="none">
    <circle cx="1090" cy="330" r="15" fill="#ffffff"/>
    <line x1="1090" y1="345" x2="1090" y2="387"/>
    <line x1="1066" y1="359" x2="1114" y2="359"/>
    <line x1="1090" y1="387" x2="1070" y2="417"/>
    <line x1="1090" y1="387" x2="1110" y2="417"/>
  </g>
  <text x="1090" y="440" text-anchor="middle" font-size="14.5" font-weight="600" fill="#9a3412">LLM provider</text>
  <text x="1090" y="458" text-anchor="middle" font-size="11.5" fill="#c2410c">Ollama · Claude</text>
  <text x="1090" y="474" text-anchor="middle" font-size="11.5" fill="#c2410c">OpenAI · OpenRouter</text>

  <!-- ============ use cases, on device ============ -->

  <!-- 1 -->
  <ellipse cx="400" cy="165" rx="180" ry="34" fill="#ffffff" stroke="#334155" stroke-width="1.6"/>
  <text x="400" y="163" text-anchor="middle" font-size="14.5" fill="#1f2937">Give a task in plain language</text>
  <text x="400" y="181" text-anchor="middle" font-size="11.5" fill="#64748b">the request is tokenized too</text>

  <!-- 2 -->
  <ellipse cx="400" cy="262" rx="180" ry="34" fill="#ffffff" stroke="#334155" stroke-width="1.6"/>
  <text x="400" y="260" text-anchor="middle" font-size="14.5" fill="#1f2937">Capture the page</text>
  <text x="400" y="278" text-anchor="middle" font-size="11.5" fill="#64748b">DOM tree · bounding boxes · screenshot</text>

  <!-- 3 -->
  <ellipse cx="400" cy="359" rx="180" ry="34" fill="#ffffff" stroke="#334155" stroke-width="1.6"/>
  <text x="400" y="357" text-anchor="middle" font-size="14.5" fill="#1f2937">Detect PII</text>
  <text x="400" y="375" text-anchor="middle" font-size="11.5" fill="#64748b">DOM signals → checksums → entities</text>

  <!-- 4 : the split -->
  <ellipse cx="400" cy="459" rx="180" ry="38" fill="#eef2ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="400" y="452" text-anchor="middle" font-size="14.5" font-weight="600" fill="#1e3a8a">Sanitize by shape</text>
  <text x="400" y="471" text-anchor="middle" font-size="11.5" fill="#1d4ed8">text → tokens · pixels → burned</text>

  <!-- 5 -->
  <ellipse cx="400" cy="592" rx="180" ry="38" fill="#eef2ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="400" y="585" text-anchor="middle" font-size="14.5" font-weight="600" fill="#1e3a8a">Validate and resolve</text>
  <text x="400" y="604" text-anchor="middle" font-size="11.5" fill="#1d4ed8">reject unknown ids and forged tokens</text>

  <!-- 6 -->
  <ellipse cx="400" cy="700" rx="180" ry="34" fill="#ffffff" stroke="#334155" stroke-width="1.6"/>
  <text x="400" y="698" text-anchor="middle" font-size="14.5" fill="#1f2937">Act on the page</text>
  <text x="400" y="716" text-anchor="middle" font-size="11.5" fill="#64748b">user confirms anything irreversible</text>

  <!-- ============ the vault ============ -->
  <rect x="596" y="500" width="150" height="72" rx="7" fill="#0f172a"/>
  <text x="671" y="524" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">VAULT</text>
  <text x="671" y="542" text-anchor="middle" font-size="10.5" fill="#93c5fd">token ↔ value</text>
  <text x="671" y="558" text-anchor="middle" font-size="10.5" fill="#93c5fd">in memory · never on disk</text>

  <!-- ============ use case beyond the boundary ============ -->
  <ellipse cx="940" cy="330" rx="128" ry="42" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/>
  <text x="940" y="323" text-anchor="middle" font-size="14.5" font-weight="600" fill="#9a3412">Plan the next action</text>
  <text x="940" y="342" text-anchor="middle" font-size="11.5" fill="#c2410c">reasons over tokens only</text>

  <!-- ============ associations ============ -->
  <line x1="104" y1="230" x2="218" y2="172" stroke="#475569" stroke-width="1.6"/>
  <line x1="104" y1="270" x2="218" y2="690" stroke="#475569" stroke-width="1.6" stroke-dasharray="4 4"/>
  <text x="126" y="470" font-size="11" fill="#64748b" transform="rotate(74 126 470)">confirms</text>

  <line x1="104" y1="590" x2="222" y2="272" stroke="#475569" stroke-width="1.6"/>

  <!-- pipeline -->
  <g stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)" fill="none">
    <line x1="400" y1="199" x2="400" y2="222"/>
    <line x1="400" y1="296" x2="400" y2="319"/>
    <line x1="400" y1="393" x2="400" y2="415"/>
    <line x1="400" y1="630" x2="400" y2="660"/>
  </g>

  <!-- vault links -->
  <line x1="562" y1="470" x2="620" y2="500" stroke="#0f172a" stroke-width="1.6" stroke-dasharray="4 4"/>
  <line x1="566" y1="580" x2="620" y2="566" stroke="#0f172a" stroke-width="1.6" stroke-dasharray="4 4"/>
  <text x="600" y="481" font-size="10.5" fill="#0f172a">store</text>
  <text x="586" y="596" font-size="10.5" fill="#0f172a">look up</text>

  <!-- across the boundary, out -->
  <path d="M 560 440 C 690 400 720 360 812 340" stroke="#c2410c" stroke-width="2.2"
        fill="none" marker-end="url(#arrowRed)"/>
  <text x="676" y="392" font-size="11.5" font-weight="600" fill="#9a3412">sanitized context</text>

  <!-- across the boundary, back -->
  <path d="M 812 360 C 700 430 640 560 568 596" stroke="#c2410c" stroke-width="2.2"
        fill="none" marker-end="url(#arrowRed)" stroke-dasharray="7 5"/>
  <text x="690" y="470" font-size="11.5" font-weight="600" fill="#9a3412">action, in tokens</text>

  <line x1="1068" y1="345" x2="1070" y2="337" stroke="#c2410c" stroke-width="1.8"/>
  <line x1="1068" y1="332" x2="1070" y2="332" stroke="#c2410c" stroke-width="1.8"/>
  <line x1="1064" y1="333" x2="1070" y2="333" stroke="#c2410c" stroke-width="2"/>

  <!-- ============ footnote ============ -->
  <text x="150" y="786" font-size="12" fill="#475569">
    The provider never receives a name, an identifier, a face or a URL path — only structure, stable tokens and redacted pixels.
  </text>

</svg>
